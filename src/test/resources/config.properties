# CM Galaxy UI Automation Framework Configuration

# Application URLs
baseUrl=https://platform.cmgalaxy.com
signupUrl=https://platform.cmgalaxy.com/sign-up
loginUrl=https://platform.cmgalaxy.com/login

# Browser Settings
# Supported browsers: chrome, edge, firefox
browser=chrome
headless=false

# Timeouts in seconds
explicitWait=15
pageLoadTimeout=30
scriptTimeout=15

# Environment
environment=production

# CAPTCHA Handling
# Allowed: true / false
# When true, framework detects and respects manual pause; when false, tests skip or report manual requirement
captcha.enabled=false
captcha.manual=false

# Test Data Settings
testdata.filepath=src/test/resources/testdata/signup-data.json

# Reporting and Screenshots
screenshot.on.failure=true
screenshot.on.pass=false
extent.report.path=reports/extent-report.html
